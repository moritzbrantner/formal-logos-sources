name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: moritzbrantner/reusable-workflows/.github/workflows/command-validation.yml@7fcd7308686c77559dd343d5e7639afb5a1646af
    with:
      setup_command: command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      command: |
        cargo fmt --check
        cargo test --locked
        cargo clippy --locked --all-targets -- -D warnings
