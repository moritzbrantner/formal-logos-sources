name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: moritzbrantner/reusable-workflows/.github/workflows/command-validation.yml@6b908ac2a438f537cdc6b5825bf839cf7184863b # main
    with:
      setup_command: command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      command: |
        cargo fmt --check
        cargo test --locked
        cargo clippy --locked --all-targets -- -D warnings
        cargo run --locked -- check --research registry/author-research.json
