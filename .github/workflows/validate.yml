name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: moritzbrantner/reusable-workflows/.github/workflows/command-validation.yml@361ab6f0fbb98e0387070fb9b694be6067fa3b3f # main
    with:
      setup_command: command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      command: |
        cargo fmt --check
        cargo test --locked
        cargo clippy --locked --all-targets -- -D warnings
